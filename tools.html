<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
	<script src="nav.js"></script>
    <title>PoE 10 Advanced Toolkits Dashboard (Bilingual)</title>
    <style>
        body { background:#0d0d0d; color:#d1d1d1; font-family:sans-serif; padding:15px; font-size:12px; }
        .box { max-width:850px; margin:0 auto; background:#141414; padding:20px; border:1px solid #222; border-radius:4px; }
        .bar { display: flex; justify-content: space-between; align-items: center; border-bottom:1px solid #222; padding-bottom:10px; margin-bottom: 20px; }
        h1 { color:#e5c158; font-size:18px; margin: 0; }
        .css-coin { width: 16px; height: 16px; background: linear-gradient(135deg, #ffe066 0%, #e5c158 50%, #b38f00 100%); border-radius: 50%; margin-right: 8px; border: 1px solid #ffe066; position: relative; }
        .css-coin::after { content: 'T'; position: absolute; font-size: 10px; font-weight: bold; color: #4d3d00; top: 50%; left: 50%; transform: translate(-50%, -50%); }
        .nav { display: flex; justify-content: center; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
        .nav-btn { padding: 4px 12px; background: #222; border: 1px solid #444; color: #fff; border-radius: 3px; cursor: pointer; font-size: 11px; font-weight: bold; }
        .nav-btn:hover { border-color: #e5c158; color: #e5c158; }
        .act { background: #e5c158; color: #111; border-color: #ffe066; }
        .card { background: #1a1a1a; border: 1px solid #2d2d2d; border-radius: 4px; padding: 12px 15px; margin-bottom: 12px; }
        .card-header { display: flex; justify-content: space-between; align-items: center; cursor: pointer; border-bottom: 1px solid #333; padding-bottom: 5px; }
        .card-title { color: #e5c158; font-weight: bold; font-size: 13px; }
        .badge-core { background: #1f4068; color: #fff; padding: 2px 6px; border-radius: 3px; font-size: 10px; font-weight: bold; }
        .badge-adv { background: #1b4332; color: #52b788; border: 1px solid #2d6a4f; padding: 2px 6px; border-radius: 3px; font-size: 10px; font-weight: bold; }
        .card-body { display: none; margin-top: 10px; line-height: 1.6; color: #b5b5b5; }
        ul { padding-left: 15px; margin: 6px 0; }
        li { margin-bottom: 4px; }
        .hl-key { color: #e5c158; font-weight: bold; }
        code { background: #000; color: #ff7b72; padding: 1px 4px; font-family: monospace; border-radius: 3px; font-size: 11px; }
        .url-box { background: #0d1b2a; border: 1px solid #1b4332; border-radius: 4px; padding: 8px 10px; margin-top: 10px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 11px; }
        .url-title { color: #52b788; font-weight: bold; }
        .poe-link { color: #4da6ff; text-decoration: none; font-weight: bold; border-bottom: 1px dashed #4da6ff; }
        .poe-link:hover { color: #85c1e9; border-bottom-style: solid; }
    </style>
</head>
<body>
<div class="box">
	<div id="global-nav"></div>
    <div class="bar">
        <div style="display:flex;align-items:center;"><div class="css-coin"></div><h1 id="ui_title">PoE 高階外部輔助工具箱</h1></div>
        <div class="btn-group">
            <button id="b_zh" class="nav-btn act" onclick="setL('zh')">繁體中文</button>
            <button id="b_en" class="nav-btn" onclick="setL('en')">English</button>
        </div>
    </div>
    <div class="nav">
        <button class="nav-btn" onclick="tglAll(true)"><span id="ui_exp">展開全部說明</span></button>
        <button class="nav-btn" onclick="tglAll(false)"><span id="ui_col">折疊全部卡片</span></button>
    </div>
    <div id="toolsContainer"></div>
</div>

<script>

    en: { t: "Path of Exile: 10 Advanced External Core Toolkits Portfolio", exp: "📜 Expand All Manuals", col: "🔒 Collapse All Cards", core: "Baseline", adv: "Endgame", dir: "🔗 Official Link: " }

    },
    {
        id: "pob", isAdv: false, url_name: "Path of Building (Community Edition) Setup Base", url: "https://github.com/PathOfBuildingCommunity/PathOfBuilding",
        t_zh: "② 大神配裝與真實傷害模擬器：Path of Building (PoB社區版)", t_en: "② Theorycrafting & True DPS Simulator: Path of Building",
        d_zh: "流放之路唯一的、最權威的、能計算真實一刀傷害的配裝模擬軟體。遊戲內面板 DPS 非常弱智，而 PoB 才是靈魂核心。",

        b_en: ["Setup: No thinking required. Mass-click the highlighted grid slots, sell to the vendor, and get 2x Raw Chaos Orbs instantly.","Pro Tips: Farm 40~60C per hour in low-tier maps within the first 48 hours of league start to secure your progression weapons."]

    },
    {
        id: "analytics", isAdv: true, badge: "Bulk Gold", url_name: "PoE Ninja Builds Leaderboard & Analytics Panel", url: "https://poe.ninja/poe1/builds/streamers",
        t_zh: "⑦ 終極配裝風向標與大傷大數據拆解：PoE Ninja Builds Analytics", t_en: "⑦ Meta Metrical Reverse Engineering Panel: PoE Ninja Builds Analytics",
        d_zh: "隱藏在 PoE Ninja 官方 Builds 天梯榜左側的頂級分析功能。進行熱度逆向拆解。",

        b_zh: ["詳細實戰：左側篩選你的技能，頁面會直接以柱狀圖與餅圖形式，統計出當前排名前1000的高手中有多少比重連了核心寶石。","避坑心得：能一鍵透視出大佬們身上選用的前三項增傷權重，讓你直接站在高手肩膀上做裝備，絕不花冤枉錢。"],
        b_en: ["Setup: View precise pie charts tracking exactly what percentage of top Chieftains link Overexertion Support.","Pro Tips: Check high-frequency jewel modifiers picked by top-tier end-game racers, ensuring zero wasted investments when re-gearing."]
    },
    {
        id: "filterblade", isAdv: true, url_name: "FilterBlade Official Direct Cloud Sync Portal", url: "https://github.com/NeverSinkDev/FilterBlade-Public-Assets",
        t_zh: "⑧ 過濾代碼網頁一鍵無感同步：FilterBlade Auto-Sync", t_en: "⑧ On-the-Fly Direct Loot Filter Synchronizer: FilterBlade Auto-Sync",
        d_zh: "網頁端微調過濾器後一鍵雲端線上同步，遊戲內秒刷新，徹底告別每次都重複下載設定檔的繁瑣流程。",
        d_en: "Tweak loot highlight rules on the website and sync instantly with your in-game client without manually downloading .filter files.",
        b_zh: ["詳細實戰：在網站內登錄授權。微調規則後，在右側點擊 Save -> Sync with Game。","避坑心得：回到遊戲內按 Esc 進設置 -> 遊戲選項 -> 過濾器旁點擊小刷新圖標。剛才網頁上的改動會被遊戲一秒鐘線上讀取！"],
        b_en: ["Setup: Log in via your official PoE profile on FilterBlade. Tweak your sorting rules, then hit Save -> Sync with Game.","Pro Tips: In-game, press Esc -> Options -> UI, hit the refresh icon next to your sync slot. The new filter goes live instantly."]
    },
    {
        id: "mapwatch", isAdv: true, url_name: "Mapwatch Official Local Log File Parser Running Page", url: "https://github.com",
        t_zh: "⑨ 純本地刷圖效率與掛機發呆清算器：Mapwatch", t_en: "⑨ Mapping Efficiency & Hideout Idle Analyzer: Mapwatch",
        d_zh: "純本地運行，透過靜默讀取遊戲日誌自動分析你每張異界地圖刷了多少秒，精確清算你在藏身處掛機發呆浪費了多少時間。",
        d_en: "A pure client-side tracker that reads your game logs to parse exactly how many seconds you take per map and how long you spend idling.",
        b_zh: [
            "詳細實战：下線前打開網頁，把遊戲根目錄 Logs 文件夾下的 Client.txt 日誌文件往網頁裡一拖。",
            "避坑心得：它會以柱狀圖告訴你發呆整理的總時長，幫你極限壓榨下賽季的開荒內卷效率。Hideout is lava！",
            "更新: TraXile 独立客户端版(功能更强大的平替)。目前社区主流的图表与效率统计工具。它不仅能离线读取日志分析历史数据，还自带游戏内悬浮窗 (Overlay)，在你刷图时实时显示计时器，并统计夺宝（Heist）、圣所（Sanctum）等各种机制的刷图收益。<a href='https://github.com/dermow/Traxile' class='poe-link' target='_blank'>TraXile</a>"
        ],
        b_en: [
            "Setup: Remember: 'Hideout is lava'. Drag your game's Client.txt log file directly into this webpage under logs directory.",
            "Pro Tips: It charts clear data breakdown tracking your active clearing vs. passive idling time, forcing you to drastically cut down town time.",
            "Update: TraXile Standalone Client (A more powerful alternative). Currently the mainstream community chart and efficiency tracking tool. It not only parses historical data offline by reading game logs, but also features an in-game Overlay that displays a real-time mapping timer and tracks your farming returns from various mechanics like Heist, Sanctum, and more. <a href='https://github.com/dermow/Traxile' class='poe-link' target='_blank'>TraXile</a>" // 👈 【新增英文行】英文内部同样使用了安全的单引号 ''

        b_en: ["Setup: Select your item type, level requirements, and base mod pools. Reroll items inside the Simulator module for zero real currency cost.","Pro Tips: The system calculates the exact statistical odds (e.g., 'Average 45 Alchs needed for Tier 1 Phys Mod'), saving you massive raw Divine investments."]

function render() {
    const u = uiText[lang];
    document.getElementById('ui_title').innerText = u.t;
    document.getElementById('ui_exp').innerText = u.exp;
    document.getElementById('ui_col').innerText = u.col;
    document.getElementById('b_zh').className = "nav-btn" + (lang === 'zh' ? " act" : "");
    document.getElementById('b_en').className = "nav-btn" + (lang === 'en' ? " act" : "");

    document.getElementById('toolsContainer').innerHTML = db.map(item => `
        <div class="card">
            <div class="card-header" onclick="tgl('${item.id}')">
                <span class="card-title">${lang === 'zh' ? item.t_zh : item.t_en}</span>
                <span class="${item.isAdv ? 'badge-adv' : 'badge-core'}">${item.isAdv ? u.adv : u.core}</span>
            </div>
            <div class="card-body" id="b_${item.id}">
                <p><b>🔍 ${lang === 'zh' ? '一句話簡介' : 'Summary'}:</b> ${lang === 'zh' ? item.d_zh : item.d_en}</p>
                <ul>${(lang === 'zh' ? item.b_zh : item.b_en).map(b => `<li>${b}</li>`).join('')}</ul>
                <div class="url-box">
                    <span class="url-title">${u.dir}</span>
                    <a href="${item.url}" class="poe-link" target="_blank">${item.url_name}</a>
                </div>
            </div>
        </div>
    `).join('');
    run();
}

function run() {
    db.forEach(item => {
        const el = document.getElementById('b_' + item.id);
        const saved = localStorage.getItem('poe_tl_v_' + item.id);
        if (saved === '1' || (saved === null && (item.id === 'overlay' || item.id === 'pob'))) {
            el.style.display = 'block';
        } else {
            el.style.display = 'none';
        }
    });
}

function tgl(k) {
    const el = document.getElementById('b_' + k);
    const visible = el.style.display === 'block';
    el.style.display = visible ? 'none' : 'block';
    localStorage.setItem('poe_tl_v_' + k, visible ? '0' : '1');
}

function tglAll(show) {
    db.forEach(item => {
        document.getElementById('b_' + item.id).style.display = show ? 'block' : 'none';
        localStorage.setItem('poe_tl_v_' + item.id, show ? '1' : '0');
    });
}

// 🟢 終極修復：對齊全局事件總線的 tools 語言切換函數
function setL(l) { 
    lang = l; 
    // 1. 統一寫入全局唯一的公共語言快取鍵名
    localStorage.setItem('poe_global_lang', l); 
    localStorage.setItem('poe_tl_lang', l); // 保持你原本舊代碼的相容性
    
    // 2. 向最上方的 nav.js 導航組件發射變字訊號
    window.dispatchEvent(new Event('poe_lang_changed'));
    
    // 3. 觸發你原本寫好的 render 函數，重新繪製你自己的長文案
    render(); 
}

window.onload = function() { 
    // 4. 初始化加載時，優先順著全局公共語言快取來識別（確保跨頁面切換時語系全球統一）
    lang = localStorage.getItem('poe_global_lang') || localStorage.getItem('poe_tl_lang') || 'zh';
    
    // 5. 執行你原本的渲染邏輯
    render(); 
}

</script>
</body>
</html>
