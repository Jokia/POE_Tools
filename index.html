<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <script src="nav.js"></script>
    <title id="page_title">PoE 43種全通貨中英及縮寫速查表</title>
    <style>
        body { background:#0d0d0d; color:#d1d1d1; font-family:sans-serif; padding:20px; font-size:13px; }
        .box { max-width:800px; margin:0 auto; background:#141414; padding:20px; border:1px solid #222; border-radius:4px; }
        
        /* ================= 標題欄容器（已整合多語言按鈕） ================= */
        .title-container { 
            display: flex; 
            align-items: center; 
            border-bottom:1px solid #222; 
            padding-bottom:10px; 
            margin-bottom: 15px; 
            margin-top: 15px; 
        }
        h1 { color:#e5c158; font-size:20px; margin: 0; flex-grow: 1; text-align: left; }
        
        .css-coin {
            width: 18px; height: 18px;
            background: linear-gradient(135deg, #ffe066 0%, #e5c158 50%, #b38f00 100%);
            border-radius: 50%; margin-right: 10px;
            box-shadow: 0 0 4px rgba(229, 193, 88, 0.6);
            border: 1px solid #ffe066; position: relative;
            flex-shrink: 0;
        }
        .css-coin::after { content: '$'; position: absolute; font-size: 11px; font-weight: bold; color: #4d3d00; top: 50%; left: 50%; transform: translate(-50%, -50%); }

        /* 標題欄右側的按鈕樣式 */
        .lang-container { display: flex; gap: 5px; flex-shrink: 0; }
        .lang-btn {
            background: #111; color: #888; border: 1px solid #2a2a2a; padding: 4px 10px;
            font-size: 11px; border-radius: 3px; cursor: pointer; transition: all 0.2s;
        }
        .lang-btn:hover { color: #ffe066; border-color: #ffe066; }
        .lang-btn.active { color: #e5c158; background: #262111; border-color: #e5c158; font-weight: bold; box-shadow: 0 0 4px rgba(229, 193, 88, 0.3); }
        /* ========================================================= */

        input { width:100%; padding:10px; background:#090909; border:1px solid #222; color:#fff; margin-bottom:15px; box-sizing:border-box; }
        table { width:100%; border-collapse:collapse; }
        th { background:#1a1a1a; color:#e5c158; text-align:left; padding:8px; font-weight:bold; border-bottom:1px solid #222; }
        td { padding:8px; border-bottom:1px solid #222; }
        tr:hover { background:#1e1e1e; }
        .tag { background:#16222f; color:#4da6ff; border:1px solid #20374f; padding:1px 5px; border-radius:3px; font-size:11px; font-family:monospace; }
    </style>
</head>
<body>
<div class="box">
    <!-- 全局導航欄 -->
    <div id="global-nav"></div>
    
    <!-- 標題欄容器（包含硬幣、標題、多語言按鈕） -->
    <div class="title-container">
        <div class="css-coin"></div>
        <h1 id="ui_main_title">Path of Exile 通貨倉庫頁全幣種速查大典</h1>
        <div class="lang-container">
            <button class="lang-btn" id="btn_zh" onclick="setLanguage('zh')">繁體中文</button>
            <button class="lang-btn" id="btn_en" onclick="setLanguage('en')">English</button>
        </div>
    </div>
    
    <input type="text" id="api" placeholder="🔍 輸入通貨名稱、英文全稱、官方縮寫(如 Div, C, Alch)過濾...">
    <table id="tbl">
        <thead>
            <tr>
                <th id="th_zh">中文名稱</th>
                <th id="th_en">英文名稱</th>
                <th id="th_abbr">常見縮寫 / 代稱</th>
            </tr>
        </thead>
        <tbody id="db"></tbody>
    </table>
</div>
<script>
// 多语言静态文本字典
const uiText = {
    zh: {
        title: "PoE 43種全通貨中英及縮寫速查表",
        mainTitle: "Path of Exile 通貨倉庫頁全幣種速查大典",
        placeholder: "🔍 輸入通貨名稱、英文全稱、官方縮寫(如 Div, C, Alch)過濾...",
        thZh: "中文名稱",
        thEn: "英文名稱",
        thAbbr: "常見縮寫 / 代稱"
    },
    en: {
        title: "PoE 43 Currency Classes & Abbreviations Cheatsheet",
        mainTitle: "Path of Exile Currency Tab Full Catalog Reference",
        placeholder: "🔍 Type currency name, English title, or abbreviation (e.g., Div, C, Alch) to filter...",
        thZh: "Chinese Name",
        thEn: "English Name",
        thAbbr: "Common Abbreviation / Alias"
    }
};

const data = [
    ["神聖石","Divine Orb","Div / Divine"],
    ["混沌石","Chaos Orb","C / Chaos"],
    ["點金石","Orb of Alchemy","Alch / Alchemy"],
    ["瓦爾石","Vaal Orb","Vaal"],
    ["崇高石","Exalted Orb","Ex / Exalted"],
    ["鏡子","Mirror of Kalandra","Mirror / 鏡子"],
    ["重鑄石","Orb of Scouring","Scour / 重鑄"],
    ["富豪石","Regal Orb","Regal / 富豪"],
    ["點r","Orb of Regret","Regret / 後悔"],
    ["極淨石","Orb of Annulment","Annul / 剝離"],
    ["蛻變石","Orb of Transmutation","Trans / Transmute"],
    ["改造石","Orb of Alteration","Alt / Alts / 改造"],
    ["增幅石","Orb of Augmentation","Aug / Augment"],
    ["機會石","Orb of Chance","Chance / 機會"],
    ["連結石","Orb of Fusing","Fusing / Fuse / Link"],
    ["工匠石","Jeweller's Orb","Jew / Jeweller / 工匠"],
    ["幻色石","Chromatic Orb","Chrome / Chromatic / 幻色"],
    ["寶石匠的方塊","Gemcutter's Prism","GCP / 寶石匠"],
    ["製圖釘","Cartographer's Chisel","Chisel / 釘子"],
    ["護甲片","Armourer's Scrap","Scrap / 護甲片"],
    ["磨刀石","Blacksmith's Whetstone","Whetstone / 磨刀石"],
    ["玻璃彈珠","Glassblower's Bauble","Bauble / 彈珠"],
    ["工程石","Engineer's Orb","Engineer / 工程"],
    ["祝福石","Blessed Orb","Bless / 祝福"],
    ["破裂石","Fracturing Orb","Fracture / 裂石 / 破裂"],
    ["卡蘭德之觸","Mirror Shard","Mirror Shard / 鏡子碎片"],
    ["神聖碎片","Divine Shard","Divine Shard / 神聖碎片"],
    ["喚醒者之石","Awakener's Orb","Awakener / 覺醒石"],
    ["救贖者之石","Redeemer's Exalted Orb","Redeemer / 救贖石"],
    ["狩獵者之石","Hunter's Exalted Orb","Hunter / 狩獵石"],
    ["十字軍之石","Crusader's Exalted Orb","Crusader / 十字軍"],
    ["督軍之石","Warlord's Exalted Orb","Warlord / 督軍"],
    ["次級/高階/卓越/無暇古靈燼火","Eldritch Ember","Ember / 紅王通貨"],
    ["次級/高階/卓越/無暇古靈星海","Eldritch Ichor","Ichor / 藍王通貨"],
    ["古靈極淨石","Eldritch Orb of Annulment","Eldritch Annul / 古靈剝離"],
    ["古靈混沌石","Eldritch Chaos Orb","Eldritch Chaos / 古靈混沌"],
    ["古靈崇高石","Eldritch Exalted Orb","Eldritch Ex / 古靈崇高"],
    ["銀幣","Silver Coin","Silver / 銀幣"],
    ["先驅石","Harbinger's Orb","Harbinger / 先驅石"],
    ["束縛石","Orb of Binding","Binding / 束縛"],
    ["地平石","Orb of Horizons","Horizon / 地平"],
    ["古文本","Ancient Orb","Ancient / 古文本"],
    ["鑑定卷軸","Scroll of Wisdom","Wisdom / 鑑定"],
    ["傳送卷軸","Portal Scroll","Portal / 傳送"]
];

let currentLang = localStorage.getItem('poe_currency_lang') || 'zh';

// 渲染表格函数
function renderTable() {
    const html = data.map(r => `<tr><td style="color:#fff;font-weight:bold;">${r[0]}</td><td style="color:#999;font-style:italic;">${r[1]}</td><td><span class="tag">${r[2]}</span></td></tr>`).join('');
    document.getElementById('db').innerHTML = html;
}

// 切换语言函数
function setLanguage(lang) {
    currentLang = lang;
    localStorage.setItem('poe_currency_lang', lang);
    
    // 更新高亮样式
    document.getElementById('btn_zh').className = "lang-btn" + (lang === 'zh' ? " active" : "");
    document.getElementById('btn_en').className = "lang-btn" + (lang === 'en' ? " active" : "");
    
    // 翻译界面文本
    const dict = uiText[lang];
    document.getElementById('page_title').innerText = dict.title;
    document.getElementById('ui_main_title').innerText = dict.mainTitle;
    document.getElementById('api').placeholder = dict.placeholder;
    document.getElementById('th_zh').innerText = dict.thZh;
    document.getElementById('th_en').innerText = dict.thEn;
    document.getElementById('th_abbr').innerText = dict.thAbbr;
}

// 初始化加载
window.onload = function() {
    renderTable();
    setLanguage(currentLang);
    
    // 绑定搜索过滤事件
    document.getElementById('api').addEventListener('keyup', function() {
        let f = this.value.toUpperCase();
        let trs = document.getElementById('db').getElementsByTagName('tr');
        for (let i = 0; i < trs.length; i++) {
            trs[i].style.display = trs[i].innerText.toUpperCase().indexOf(f) > -1 ? "" : "none";
        }
    });
}
</script>
</body>
</html>
