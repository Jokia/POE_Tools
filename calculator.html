<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
	<script src="nav.js"></script>
    <title>PoE 自動存檔身價動態計算器</title>
    <style>
        body { background:#0d0d0d; color:#d1d1d1; font-family:sans-serif; padding:15px; font-size:12px; }
        .box { max-width:800px; margin:0 auto; background:#141414; padding:20px; border:1px solid #222; border-radius:4px; }
        .title-container { display: flex; align-items: center; justify-content: center; border-bottom:1px solid #222; padding-bottom:10px; margin-bottom: 15px; }
        h1 { text-align:center; color:#e5c158; font-size:18px; margin: 0; }
        .css-coin { width: 16px; height: 16px; background: linear-gradient(135deg, #ffe066 0%, #e5c158 50%, #b38f00 100%); border-radius: 50%; margin-right: 8px; border: 1px solid #ffe066; position: relative; }
        .css-coin::after { content: '$'; position: absolute; font-size: 10px; font-weight: bold; color: #4d3d00; top: 50%; left: 50%; transform: translate(-50%, -50%); }
        .rate-panel { background: #1a1a1a; border: 1px solid #333; padding: 10px; margin-bottom: 15px; border-radius: 4px; }
        .rate-grid { display: flex; flex-wrap: wrap; gap: 12px; }
        .rate-input { width: 55px; padding: 3px; background: #050505; border: 1px solid #444; color: #e5c158; text-align: center; font-weight: bold; }
        .result-panel { background: #1c1303; border: 1px solid #e5c158; padding: 12px; margin-bottom: 15px; text-align: center; border-radius: 4px; }
        .result-value { font-size: 22px; font-weight: bold; color: #fff; }
        .currency-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 8px; margin-bottom: 15px; }
        .currency-card { background: #1c1c1c; border: 1px solid #2d2d2d; padding: 8px; border-radius: 4px; display: flex; align-items: center; justify-content: space-between; }
        .count-input { width: 70px; padding: 4px; background: #090909; border: 1px solid #333; color: #fff; text-align: right; font-weight: bold; }
        .clear-btn { display: block; width: 90px; margin: 0 auto; padding: 6px; background: #311; border: 1px solid #522; color: #f66; cursor: pointer; font-weight: bold; }
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        input[type="number"] { -moz-appearance: textfield; }
    </style>
</head>
<body>
<div class="box">
	<div id="global-nav"></div>
    <div class="title-container"><div class="css-coin"></div><h1>Path of Exile 動態市價身價自動計算器</h1></div>
    
    <!-- 匯率修改面板 -->
    <div class="rate-panel">
        <div style="color:#e5c158; font-weight:bold; margin-bottom:8px;">⚙️ 即時市場匯率微調面板 (單位：Chaos)</div>
        <div class="rate-grid">
            <div>1 Divine = <input type="number" id="r_div" class="rate-input" value="150" oninput="saveAndCalc()"> C</div>
            <div>1 崇高石 = <input type="number" id="r_ex" class="rate-input" value="10" oninput="saveAndCalc()"> C</div>
            <div>1 破裂石 = <input type="number" id="r_frac" class="rate-input" value="4500" oninput="saveAndCalc()"> C</div>
            <div>1 淨化石 = <input type="number" id="r_annul" class="rate-input" value="3" oninput="saveAndCalc()"> C</div>
            <div>1 連結石 = <input type="number" id="r_fuse" class="rate-input" value="0.3" oninput="calc()"> C</div>
            <div>1 改造石 = <input type="number" id="r_alt" class="rate-input" value="0.15" oninput="saveAndCalc()"> C</div>
        </div>
    </div>

    <div class="result-panel">
        <div style="color:#e5c158; margin-bottom:3px;">💰 您的資產總價值估算 (Net Worth) 💰</div>
        <div class="result-value" id="resDiv">0.00 Divine</div>
        <div style="color:#aaa; font-size:11px;" id="resChaos">等值於 0 Chaos</div>
    </div>

    <div class="currency-grid" id="grid"></div>
    <button class="clear-btn" onclick="cls()">一鍵清空</button>
</div>

<script>
const list = [
    ["divine", "神聖石 / 神聖石", "Divine Orb", () => parseFloat(document.getElementById('r_div').value)||0],
    ["chaos", "混沌石 / 混沌石", "Chaos Orb", () => 1],
    ["mirror", "鏡子 / 鏡子", "Mirror of Kalandra", () => 60000],
    ["exalted", "崇高石 / 崇高石", "Exalted Orb", () => parseFloat(document.getElementById('r_ex').value)||0],
    ["alchemy", "點金石 / 點金石", "Orb of Alchemy", () => 0.25],
    ["vaal", "瓦爾石 / 瓦爾石", "Vaal Orb", () => 0.8],
    ["scouring", "重鑄石 / 重鑄石", "Orb of Scouring", () => 0.5],
    ["regal", "富豪石 / 富豪石", "Regal Orb", () => 0.3],
    ["regret", "點Regret / 後悔石", "Orb of Regret", () => 0.4],
    ["annulment", "極淨石 / 淨化石", "Orb of Annulment", () => parseFloat(document.getElementById('r_annul').value)||0],
    ["transmute", "蛻變石 / 蛻變石", "Orb of Transmutation", () => 0.05],
    ["alteration", "改造石 / 改造石", "Orb of Alteration", () => parseFloat(document.getElementById('r_alt').value)||0],
    ["augmentation", "增幅石 / 增幅石", "Orb of Augmentation", () => 0.04],
    ["chance", "機會石 / 機會石", "Orb of Chance", () => 0.1],
    ["fusing", "連結石 / 連結石", "Orb of Fusing", () => parseFloat(document.getElementById('r_fuse').value)||0],
    ["jeweller", "工匠石 / 工匠石", "Jeweller's Orb", () => 0.1],
    ["chromatic", "幻色石 / 幻色石", "Chromatic Orb", () => 0.1],
    ["gcp", "寶石匠的方塊", "Gemcutter's Prism", () => 1],
    ["chisel", "製圖釘 / 製圖釘", "Cartographer's Chisel", () => 0.2],
    ["scrap", "護甲片 / 護甲片", "Armourer's Scrap", () => 0.03],
    ["whetstone", "磨刀石 / 磨刀石", "Blacksmith's Whetstone", () => 0.03],
    ["bauble", "玻璃彈珠 / 彈珠", "Glassblower's Bauble", () => 0.5],
    ["engineer", "工程石 / 工程石", "Engineer's Orb", () => 0.2],
    ["blessed", "祝福石 / 祝福石", "Blessed Orb", () => 0.2],
    ["fracture", "破裂石 / 破裂石", "Fracturing Orb", () => parseFloat(document.getElementById('r_frac').value)||0],
    ["mirrorshard", "鏡石 / 鏡子碎片", "Mirror Shard", () => 3000],
    ["divineshard", "神聖碎片 / 碎片", "Divine Shard", () => 7.5],
    ["awakener", "喚醒者之石", "Awakener's Orb", () => 300],
    ["ember", "古靈燼火 (紅王)", "Eldritch Ember", () => 0.5],
    ["ichor", "古靈星海 (藍王)", "Eldritch Ichor", () => 0.5],
    ["silver", "銀幣 / 銀幣", "Silver Coin", () => 0.2],
    ["harbinger", "先驅石 / 先驅石", "Harbinger's Orb", () => 1],
    ["binding", "束縛石 / 束縛石", "Orb of Binding", () => 0.1],
    ["horizon", "地平石 / 地平石", "Orb of Horizons", () => 0.1],
    ["ancient", "古文本 / 裂界石", "Ancient Orb", () => 15],
    ["wisdom", "鑑定卷軸 / 鑑定", "Scroll of Wisdom", () => 0.01],
    ["portal", "傳送卷軸 / 傳送", "Portal Scroll", () => 0.01]
];

// 動態渲染
document.getElementById('grid').innerHTML = list.map(item => `
    <div class="currency-card">
        <div style="display:flex; flex-direction:column;">
            <span style="color:#fff; font-weight:bold; font-size:11px;">${item[1]}</span>
            <span style="color:#888; font-style:italic; font-size:10px;">${item[2]}</span>
        </div>
        <input type="number" id="${item[0]}" class="count-input" min="0" placeholder="0" oninput="saveAndCalc()">
    </div>
`).join('');

// 核心計算與即時自動儲存邏輯
function saveAndCalc() {
    let cTotal = 0;
    const dRate = parseFloat(document.getElementById('r_div').value) || 150;
    
    // 儲存當前匯率
    const rates = ["div", "ex", "frac", "annul", "fuse", "alt"];
    rates.forEach(r => localStorage.setItem("poe_r_" + r, document.getElementById("r_" + r).value));

    list.forEach(item => {
        const input = document.getElementById(item[0]);
        const count = parseFloat(input.value) || 0;
        // 即時儲存每一種通貨輸入的數量
        localStorage.setItem("poe_val_" + item[0], input.value);
        cTotal += count * item[3]();
    });
    const dTotal = dRate > 0 ? (cTotal / dRate) : 0;
    document.getElementById('resDiv').innerText = dTotal.toFixed(2) + " Divine";
    document.getElementById('resChaos').innerText = "等值於 " + Math.round(cTotal) + " Chaos";
}

// 網頁載入時自動讀取恢復資料
window.onload = function() {
    const rates = ["div", "ex", "frac", "annul", "fuse", "alt"];
    rates.forEach(r => {
        const savedRate = localStorage.getItem("poe_r_" + r);
        if (savedRate !== null) document.getElementById("r_" + r).value = savedRate;
    });

    list.forEach(item => {
        const savedVal = localStorage.getItem("poe_val_" + item[0]);
        if (savedVal !== null) document.getElementById(item[0]).value = savedVal;
    });
    saveAndCalc(); // 恢復後自動計算一次
}

// 一鍵徹底清空快取與輸入
function cls() {
    list.forEach(item => { 
        document.getElementById(item[0]).value = ""; 
        localStorage.removeItem("poe_val_" + item[0]);
    });
    saveAndCalc();
}
</script>
</body>
</html>
